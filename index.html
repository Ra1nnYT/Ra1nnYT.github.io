<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rina!</title>
    <style>
        /* Catppuccin Mocha Palette */
        :root {
            --ctp-base: #1e1e2e;
            --ctp-mantle: #181825;
            --ctp-crust: #11111b;
            --ctp-text: #cdd6f4;
            --ctp-subtext1: #bac2de;
            --ctp-subtext0: #a6adc8;
            --ctp-overlay2: #9399b2;
            --ctp-overlay1: #7f849c;
            --ctp-overlay0: #6c7086;
            --ctp-surface2: #585b70;
            --ctp-surface1: #45475a;
            --ctp-surface0: #313244;
            --ctp-lavender: #b4befe;
            --ctp-blue: #89b4fa;
            --ctp-sapphire: #74c7ec;
            --ctp-sky: #89dceb;
            --ctp-teal: #94e2d5;
            --ctp-green: #a6e3a1;
            --ctp-yellow: #f9e2af;
            --ctp-peach: #fab387;
            --ctp-maroon: #eba0ac;
            --ctp-red: #f38ba8;
            --ctp-mauve: #cba6f7;
            --ctp-pink: #f5c2e7;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, var(--ctp-base) 0%, var(--ctp-mantle) 100%);
            color: var(--ctp-text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        /* Background overlay for smooth transitions */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.6s ease-in-out;
            z-index: -1;
            background: linear-gradient(135deg, var(--ctp-base) 0%, var(--ctp-mantle) 100%);
        }

        /* Dynamic background overlays */
        body.youtube-bg::before {
            background: linear-gradient(135deg,
                color-mix(in srgb, var(--ctp-base) 70%, var(--ctp-red) 30%) 0%,
                color-mix(in srgb, var(--ctp-mantle) 70%, var(--ctp-maroon) 30%) 100%);
            opacity: 1;
        }

        body.bluesky-bg::before {
            background: linear-gradient(135deg,
                color-mix(in srgb, var(--ctp-base) 70%, var(--ctp-sky) 30%) 0%,
                color-mix(in srgb, var(--ctp-mantle) 70%, var(--ctp-sapphire) 30%) 100%);
            opacity: 1;
        }

        body.twitter-bg::before {
            background: linear-gradient(135deg,
                color-mix(in srgb, var(--ctp-base) 70%, var(--ctp-blue) 30%) 0%,
                color-mix(in srgb, var(--ctp-mantle) 70%, var(--ctp-sapphire) 30%) 100%);
            opacity: 1;
        }

        body.github-bg::before {
            background: linear-gradient(135deg,
                color-mix(in srgb, var(--ctp-base) 70%, var(--ctp-overlay2) 30%) 0%,
                color-mix(in srgb, var(--ctp-mantle) 70%, var(--ctp-surface2) 30%) 100%);
            opacity: 1;
        }

        body.nightlight-bg::before {
            background: linear-gradient(135deg,
                color-mix(in srgb, var(--ctp-base) 70%, var(--ctp-mauve) 30%) 0%,
                color-mix(in srgb, var(--ctp-mantle) 70%, var(--ctp-pink) 30%) 100%);
            opacity: 1;
        }

        body.kofi-bg::before {
            background: linear-gradient(135deg,
                color-mix(in srgb, var(--ctp-base) 70%, var(--ctp-yellow) 30%) 0%,
                color-mix(in srgb, var(--ctp-mantle) 70%, var(--ctp-peach) 30%) 100%);
            opacity: 1;
        }

        /* Cursor particles */
        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: var(--ctp-mauve);
            border-radius: 50%;
            pointer-events: none;
            opacity: 0.8;
            animation: cursorFall 2s ease-out forwards;
        }

        .particle.lavender {
            background: var(--ctp-lavender);
        }

        .particle.pink {
            background: var(--ctp-pink);
        }

        .particle.blue {
            background: var(--ctp-blue);
        }

        .particle.teal {
            background: var(--ctp-teal);
        }

        @keyframes cursorFall {
            0% {
                transform: translateY(0) rotate(0deg) scale(1);
                opacity: 0.8;
            }
            100% {
                transform: translateY(100px) rotate(360deg) scale(0);
                opacity: 0;
            }
        }

        .container {
            max-width: 400px;
            width: 100%;
            text-align: center;
            animation: fadeInUp 0.8s ease-out;
            position: relative;
            z-index: 1;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .profile-section {
            margin-bottom: 30px;
        }

        .profile-pic {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 4px solid var(--ctp-lavender);
            object-fit: cover;
            margin-bottom: 15px;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .profile-pic:hover {
            transform: scale(1.05);
            box-shadow: 0 12px 48px rgba(180, 190, 254, 0.3);
        }

        .username {
            font-size: 24px;
            font-weight: 600;
            color: var(--ctp-mauve);
            margin-bottom: 5px;
        }

        .pronouns {
            font-size: 14px;
            color: var(--ctp-subtext0);
            margin-bottom: 8px;
            font-weight: 500;
        }

        .bio {
            color: var(--ctp-subtext1);
            font-size: 16px;
            line-height: 1.4;
        }

        .links-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .link-item {
            background: var(--ctp-surface0);
            border: 2px solid var(--ctp-surface1);
            border-radius: 16px;
            padding: 16px 20px;
            text-decoration: none;
            color: var(--ctp-text);
            font-weight: 500;
            font-size: 16px;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            position: relative;
            overflow: hidden;
        }

        .link-item::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1), transparent);
            transition: left 0.5s ease;
        }

        .link-item:hover::before {
            left: 100%;
        }

        .link-item:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4);
            border-color: var(--ctp-lavender);
        }

        .youtube:hover {
            background: linear-gradient(135deg, var(--ctp-red), var(--ctp-maroon));
            border-color: var(--ctp-red);
        }

        .bluesky:hover {
            background: linear-gradient(135deg, var(--ctp-sky), var(--ctp-sapphire));
            border-color: var(--ctp-sky);
        }

        .twitter:hover {
            background: linear-gradient(135deg, var(--ctp-blue), var(--ctp-sapphire));
            border-color: var(--ctp-blue);
        }

        .github:hover {
            background: linear-gradient(135deg, var(--ctp-overlay2), var(--ctp-surface2));
            border-color: var(--ctp-overlay2);
        }

        .kofi:hover {
            background: linear-gradient(135deg, var(--ctp-yellow), var(--ctp-peach));
            border-color: var(--ctp-yellow);
        }

        .nightlight:hover {
            background: linear-gradient(135deg, var(--ctp-mauve), var(--ctp-pink));
            border-color: var(--ctp-mauve);
        }

        .icon {
            width: 24px;
            height: 24px;
            flex-shrink: 0;
        }

        .footer {
            margin-top: 40px;
            color: var(--ctp-overlay2);
            font-size: 14px;
        }

        /* Mobile optimizations */
        @media (max-width: 480px) {
            .container {
                max-width: 350px;
            }

            .profile-pic {
                width: 100px;
                height: 100px;
            }

            .username {
                font-size: 22px;
            }

            .pronouns {
                font-size: 13px;
            }

            .link-item {
                padding: 14px 18px;
                font-size: 15px;
            }
        }
    </style>
</head>
<body>

    <script>
        // Create particles from cursor position
        function createCursorParticle(x, y) {
            const particle = document.createElement('div');
            particle.className = 'particle';

            // Random particle colors
            const colors = ['', 'lavender', 'pink', 'blue', 'teal'];
            const randomColor = colors[Math.floor(Math.random() * colors.length)];
            if (randomColor) particle.classList.add(randomColor);

            // Random size
            const size = Math.random() * 4 + 2;
            particle.style.width = size + 'px';
            particle.style.height = size + 'px';

            // Position at cursor
            particle.style.left = x + 'px';
            particle.style.top = y + 'px';

            // Random horizontal drift
            const drift = (Math.random() - 0.5) * 60;
            particle.style.setProperty('--drift', drift + 'px');

            // Add slight random rotation and fall distance
            const fallDistance = Math.random() * 50 + 80;
            const rotation = Math.random() * 360;
            particle.style.animationDuration = (Math.random() * 0.5 + 1.5) + 's';

            document.body.appendChild(particle);

            // Remove particle after animation
            setTimeout(() => {
                if (particle.parentNode) {
                    particle.parentNode.removeChild(particle);
                }
            }, 2500);
        }

        // Track mouse movement and create particles
        let lastParticleTime = 0;
        document.addEventListener('mousemove', function(e) {
            const currentTime = Date.now();
            // Throttle particle creation to every 50ms
            if (currentTime - lastParticleTime > 50) {
                createCursorParticle(e.clientX, e.clientY);
                lastParticleTime = currentTime;
            }
        });

        // Add background color transitions and interactive effects
        document.addEventListener('DOMContentLoaded', function() {
            const links = document.querySelectorAll('.link-item');
            const body = document.body;

            links.forEach(link => {
                link.addEventListener('mouseenter', function() {
                    this.style.transform = 'translateY(-2px) scale(1.02)';

                    // Add background class based on link type
                    const linkClass = this.classList[1]; // Gets the second class (youtube, bluesky, etc.)
                    body.className = `${linkClass}-bg`;
                });

                link.addEventListener('mouseleave', function() {
                    this.style.transform = 'translateY(0) scale(1)';

                    // Remove background class to trigger fade-out
                    body.className = '';
                });
            });

            // Add a subtle floating animation to the profile picture
            const profilePic = document.querySelector('.profile-pic');
            let floatDirection = 1;

            setInterval(() => {
                const currentTransform = profilePic.style.transform || 'translateY(0px)';
                const currentY = parseFloat(currentTransform.match(/translateY\(([^)]+)\)/)?.[1] || 0);

                if (currentY >= 5) floatDirection = -1;
                if (currentY <= -5) floatDirection = 1;

                profilePic.style.transform = `translateY(${currentY + (floatDirection * 0.5)}px)`;
            }, 100);
        });
    </script>
