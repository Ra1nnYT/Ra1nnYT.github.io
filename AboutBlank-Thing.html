<!DOCTYPE html>
<html>
    <head>
        <title>about:blank | TG20</title>
    </head>
    <body>
<h1 style="color:White;"> About:Blank Creator!</h1>
        <script>
        function create() {
            var url = document.getElementById('input').value;
            var win = window.open();
            win.document.body.style.margin = '0';
            win.document.body.style.height = '100vh';
            var iframe = win.document.createElement('iframe');
            iframe.style.border = 'none';
            iframe.style.width = '100%';
            iframe.style.height = '100%';
            iframe.style.margin = '0';
            iframe.src = url;
            win.document.body.appendChild(iframe);
        }
        </script>
        <input type="text" value="https://www.google.com/" placeholder="https://google.com" id='input' autofocus>
        <button onclick='create()'>Create!</button>
<h3 style="color:White;"> Just type in your URl, and click create. BOOM!</h3>
<h3 style="color:White;">About Blank Creator made by Aeon</h3>
    </body>
</html>
